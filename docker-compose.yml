version: "3.9"

services:
  db:
    image: postgres:14
    container_name: auth-db
    environment:
      POSTGRES_USER: daffarez
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: go-auth-api
    depends_on:
      - db
    ports:
      - "8088:8088"
    env_file:
      - .env
    restart: unless-stopped

volumes:
  db_data:
